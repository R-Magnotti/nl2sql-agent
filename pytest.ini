[pytest]
## the bare `pytest` run is the fast one: tests/ only, no model weights, nothing
## that needs a server. the evals are opt-in because they cost ~11GB of embedder
## downloads and several hundred ollama calls:
##
##     pytest evals -v
##
testpaths = tests
pythonpath = .

markers =
    integration: needs a live LLM endpoint; skipped when nothing is listening
