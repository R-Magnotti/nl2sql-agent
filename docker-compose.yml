services:
  db:
    image: pgvector/pgvector:pg18
    container_name: nl2sql-db
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nl2sql
    ports:
      - "5433:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - nl2sql-data:/var/lib/postgresql

volumes:
  nl2sql-data: